<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-dark">
<div class="card p-4 shadow" style="width: 420px;">
    <div class="text-center mb-4">
        <h1>Formulario</h1>
    </div>

    <div id="idMensaje" class="alert alert-warning d-none" role="alert"></div>

    <form id="idForm" method="post" action="procesar-login">
        <div class="mb-3">
            <label for="idNombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="idNombre" name="nombre">
        </div>

        <div class="mb-3">
            <label for="idSector" class="form-label">Sector</label>
            <input type="text" class="form-control" id="idSector" name="sector">
        </div>

        <div class="mb-3">
            <label class="form-label">Nivel Escolar</label>

            <div class="dropdown">
                <button id="btnNivelEscolar" class="btn btn-secondary dropdown-toggle w-100" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Seleccione
                </button>

                <ul class="dropdown-menu w-100">
                    <li><a class="dropdown-item" href="#" data-value="Básico">Básico</a></li>
                    <li><a class="dropdown-item" href="#" data-value="Medio">Medio</a></li>
                    <li><a class="dropdown-item" href="#" data-value="Grado universitario">Grado universitario</a></li>
                    <li><a class="dropdown-item" href="#" data-value="Postgrado">Postgrado</a></li>
                    <li><a class="dropdown-item" href="#" data-value="Doctorado">Doctorado</a></li>
                </ul>
            </div>

            <input type="hidden" class="form-control" id="idNivelEscolar" name="nivelEscolar">


        </div>

        <div class="mb-3">
            <label for="idUsuario" class="form-label">Registrado por</label>
            <input type="text" class="form-control" id="idUsuario" disabled>

        </div>

        <div class="d-flex gap-3 justify-content-center mt-4">
            <button type="submit" class="btn btn-primary">
                Enviar
            </button>

            <a class="btn btn-danger" href="/">
                Cancelar
            </a>
        </div>

    </form>
</div>

<script src="/js/autenticacion.js"></script>
<script src="/js/formulario.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
