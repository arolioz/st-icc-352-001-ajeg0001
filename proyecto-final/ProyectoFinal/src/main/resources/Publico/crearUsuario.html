<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-dark">

    <div id="idNavbar"></div>

    <div class="card p-4 shadow" style="width: 420px;">
        <div class="text-center mb-4">
            <h1>Crear Usuario</h1>
        </div>

        <form id="idFormUsuario" method="post">
            <div class="mb-3">
                <label for="usuario" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="usuario" name="usuario">
            </div>

            <div class="mb-3">
                <label for="idPassword" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="idPassword" name="password">
            </div>

            <div class="d-flex gap-3 justify-content-center">
                <button type="submit" class="btn btn-primary">
                    Registrar
                </button>

                <a id="btnCancelar" type="button" class="btn btn-danger">
                    Cancelar
                </a>
            </div>

        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/autenticacion.js"></script>
    <script src="js/navbar.js"></script>
    <script src="/js/crearUsuario.js"></script>


</body>
</html>
