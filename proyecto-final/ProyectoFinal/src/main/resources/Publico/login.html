<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-dark">
<div class="card p-4 shadow" style="width: 420px;">
    <h1 class="text-center mb-4">Iniciar sesión</h1>


    <form id="loginForm" method="post" action="procesar-login">
        <div class="mb-3">
            <label for="idUsuario" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="idUsuario" name="usuario">
        </div>

        <div class="mb-3">
            <label for="idPassword" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="idPassword" name="password">
        </div>

        <div class="d-flex gap-3 justify-content-center">
            <button type="submit" class="btn btn-primary">
                Enviar
            </button>

            <a class="btn btn-danger" href="/">
                Cancelar
            </a>
        </div>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/login.js"></script>

</body>
</html>
