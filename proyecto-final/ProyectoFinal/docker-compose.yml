# Atajo para construir y levantar la demo con un solo comando:
#   docker compose up --build
# Luego abre http://localhost:7000
services:
  app:
    build: .
    ports:
      - "7000:7000"
    environment:
      - DB_URL=${DB_URL}
      - PORT=7000
    restart: unless-stopped
  cliente-grpc:
    build: .venv
    ports:
      - "7001:7001"
    environment:
      - PORT=7001
    restart: unless-stopped